[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readligo"
version = "0.2.0"
description = "GWOSC strain I/O and the narrowband cleaning pipeline that feeds CW searches"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "astroboy07", email = "saif10888@gmail.com" },
]
requires-python = ">=3.11"
keywords = ["LIGO", "gravitational-waves", "GW", "GWOSC", "signal-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
# Tested with numpy 2.0.2, scipy 1.16.3, h5py 3.15.1 (ISSUES.md E2).
dependencies = [
    "h5py>=3.9",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
# v1 chain: plot_cleaning needs matplotlib, process_run needs rich.
legacy = [
    "matplotlib>=3.7",
    "rich>=13",
]
# Validation scripts (scripts/validation): LALSuite for SSB timing, SFTs and ComputeFstatistic_v2.
validation = [
    "lalsuite>=7.20",
    "solar-system-ephemerides",
]
dev = [
    "pytest>=7",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.scripts]
readligo = "readligo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["readligo*"]
